name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15 / Xcode 16.4
            runner: macos-15
            xcode: /Applications/Xcode_16.4.app/Contents/Developer
          - name: macOS 26 / Xcode 26.6
            runner: macos-26
            xcode: /Applications/Xcode_26.6.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select Xcode
        run: sudo xcode-select -s "${{ matrix.xcode }}"
      - name: Install quality-gate tools
        run: |
          set -euo pipefail
          brew install ripgrep
          rg --version
      - name: Record toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Resolve dependencies
        run: swift package resolve
      - name: Quality gates
        run: ./Scripts/check.sh
      - name: Compile Release app target
        run: |
          set -euo pipefail
          xcodebuild \
            -project LiveChurchTranslation.xcodeproj \
            -scheme LiveChurchTranslation \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/LiveChurchTranslationDerivedData" \
            LCT_COMPILE_ONLY_APP_BUILD=1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
